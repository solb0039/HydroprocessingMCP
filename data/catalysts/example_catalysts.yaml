# Example (generic, illustrative) catalyst library. Replace with your vendor data.
# activity = relative volume activity (RVA) vs the reference catalyst used in the unit's
# calibration (here CAT-COMO-REF = 1.0 for every reaction).
catalysts:
  - id: INERT-BALL-19MM
    name: Inert alumina support balls 3/4 in
    function: inert
    shape: sphere
    size_mm: 19
    density_sock_lb_ft3: 85
    void_fraction_sock: 0.40
    package_size_lb: 2200
    cost_per_lb: 1.2
  - id: INERT-BALL-6MM
    name: Inert alumina support balls 1/4 in
    function: inert
    shape: sphere
    size_mm: 6
    density_sock_lb_ft3: 85
