[project]
name = "hydromcp"
version = "0.1.0"
description = "FastMCP server for refinery hydroprocessing analysis, catalyst loading, forecasting and catalyst-system proposals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.10",
    "pydantic>=2.6",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "pint>=0.23",
    "sympy>=1.12",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "rdkit>=2024.3.1",
]

[project.optional-dependencies]
sql = ["pyodbc>=5.0", "psycopg[binary]>=3.1"]
parquet = ["pyarrow>=15"]

[project.scripts]
hydromcp = "hydromcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B023", "E731", "E741", "B905"]  # immediately-evaluated lambdas in root finding
